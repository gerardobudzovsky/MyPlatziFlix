spring:
  application:
    name: MyPlatziFlix
  
  datasource:
    url: jdbc:mysql://localhost:3306/myplatziflix
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        "format_sql": true
    database-platform: org.hibernate.dialect.MySQLDialect
  
  data:
    jpa:
      repositories:
        enabled: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    "org.hibernate.SQL": DEBUG 
    "com.practice.MyPlatziFlix": INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health, info